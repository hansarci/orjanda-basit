name: APK Üret

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri indir
        run: flutter pub get

      - name: Android klasörünü oluştur
        run: flutter create --platforms=android --org com.turhan .

      - name: Uygulama adını ayarla
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Orjanda+"/' "$MANIFEST"
          fi

      - name: İkonları üret
        run: dart run flutter_launcher_icons

      - name: Firebase (google-services) bağla
        run: |
          if [ -f "google-services.json" ]; then
            echo "google-services.json bulundu, android/app içine kopyalanıyor."
            cp google-services.json android/app/google-services.json
            PROJECT_GRADLE="android/build.gradle"
            APP_GRADLE="android/app/build.gradle"
            if [ -f "$PROJECT_GRADLE" ]; then
              awk '/dependencies *{/{print;print "        classpath (\x27com.google.gms:google-services:4.4.2\x27)";next}1' "$PROJECT_GRADLE" > tmp && mv tmp "$PROJECT_GRADLE"
            fi
            if [ -f "$APP_GRADLE" ]; then
              echo "" >> "$APP_GRADLE"
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          else
            echo "UYARI: Repo kökünde google-services.json bulunamadı. Firebase bağlanmadan build alınacak."
          fi

      - name: APK üret
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: orjanda-apk
          path: build/app/outputs/flutter-apk/app-release.apk
